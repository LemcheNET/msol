# Microsoft web apps launched as separate windows by `msol`.
#
# Format (pipe separated):
#   id | Name | URL | icon | Comment | Group | Default | Official icon | Also opens
#
#   id        short name used on the command line and in the .desktop file name
#   URL       start page. The window id KDE sees is derived from this URL's
#             host + path (query string ignored), so every app needs a distinct
#             host/path or its windows group together.
#   icon      generic icon: a theme icon name or an absolute path to a PNG/SVG
#   Group     section in the launcher and in "Customize apps"
#   Default   on = shown (launcher + menu) until you choose otherwise
#   Official  where `msol icons official` gets Microsoft's own icon:
#               fabric:<name>  Microsoft's Fluent brand-icon CDN
#               site           the icon the app's own site declares (default)
#               <https URL>    that page's declared icon, or that image
#   Also opens  other addresses of the same app (comma separated, host/path).
#             When an app window opens one of these (for example from
#             Microsoft's app menu), msol opens this app in its own window.
#
# Which apps are shown is your choice: launcher -> Customize apps, or
# `msol enable <id|group>` / `msol disable <id|group>` (saved in
# ~/.config/msol/enabled-apps; this file keeps the defaults).
#
# Work/school accounts use outlook.office.com; personal (outlook.com/hotmail)
# accounts should use https://outlook.live.com/mail/ and .../calendar/ instead.
# Marked (unverified): could not be checked while signed out; try it, and
# check `msol log` if it does not open the right app.

