name: DCO

# Developer Certificate of Origin: every commit in a pull request must carry a
# "Signed-off-by: Name <email>" line from its author (git commit -s).
# See CONTRIBUTING.md. Commits by bots (Dependabot) are exempt.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name="$(git log -1 --format=%an "$c")"
            email="$(git log -1 --format=%ae "$c")"
            subject="$(git log -1 --format=%s "$c")"
            case "$email" in
              *'[bot]@users.noreply.github.com') echo "skip  ${c:0:7} (bot: $name)"; continue ;;
            esac
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$email>"; then
              echo "ok    ${c:0:7} $subject"
            else
              echo "::error::Commit ${c:0:7} (\"$subject\") has no 'Signed-off-by: $name <$email>' line."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s'; to fix existing ones: git rebase --signoff $BASE"
            exit 1
          fi
