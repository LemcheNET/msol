name: Release

# Push a tag like v1.2.3 to build the .deb and publish a GitHub release with it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: write    # start the Pages deploy, which adds the release to the APT repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#v}"
          echo "$VERSION" > VERSION
          mkdir -p dist
          "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target dist/
          (cd dist && sha256sum ./*.deb > SHA256SUMS)
      - name: Smoke-test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          msol version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.deb dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "msol $TAG" --generate-notes --verify-tag
      - name: Update the APT repository
        env:
          GH_TOKEN: ${{ github.token }}
        # (A release made with the workflow token doesn't trigger other workflows by itself.)
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Add the release to the LemcheNET apt repository
        env:
          # Fine-grained token with Contents: read and write on LemcheNET/lemchenet.github.io only.
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.LEMCHENET_APT_DISPATCH_TOKEN }}
        # The nightly rebuild of products.lemche.net/apt picks the release up if this fails.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LEMCHENET_APT_DISPATCH_TOKEN is not set: the release reaches products.lemche.net/apt at the nightly rebuild."
            exit 0
          fi
          gh api repos/LemcheNET/lemchenet.github.io/dispatches -f event_type=apt-release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$TAG" \
            || echo "::warning::The dispatch failed: the release reaches products.lemche.net/apt at the nightly rebuild."
