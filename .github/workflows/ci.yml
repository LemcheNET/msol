name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning msol packaging/flatpak/*.sh
      - name: ruff
        run: pipx run ruff==0.17.6 check .
      - name: Python syntax
        run: python3 -m py_compile ./*.py
      - name: Extension
        run: |
          jq -e '.manifest_version == 3' extension/manifest.json
          node --check extension/background.js
      - name: apps.conf parses and window ids are unique
        run: |
          ./msol list
          dupes="$(./msol ids | cut -d'|' -f2 | sort | uniq -d)"
          [ -z "$dupes" ] || { echo "Apps share a window id: $dupes"; exit 1; }

  package:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - name: Build
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          export VERSION="${base#v}-dev.$(git rev-list --count HEAD)+g$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          mkdir -p dist
          "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target dist/
          ls -l dist
      - name: Install and smoke-test the package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          dpkg -L msol
          msol version
          msol list
          test -x /usr/lib/msol/msol-launcher.py
          python3 -c "import PyQt6.QtWidgets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msol-deb
          path: dist/*.deb
          if-no-files-found: error
