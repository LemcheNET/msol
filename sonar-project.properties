# SonarQube Cloud (sonarcloud.io) project settings, used by .github/workflows/sonarcloud.yml
sonar.organization=lemchenet
sonar.projectKey=LemcheNET_msol
sonar.projectName=msol
sonar.sources=.
sonar.exclusions=site/**/*.png,**/*.svg,packaging/apt/*.gpg
sonar.python.version=3.10, 3.11, 3.12, 3.13
# Wait for the quality gate and fail the check if it fails. The "SonarQube Cloud"
# check is required on main, so a failed quality gate blocks the merge.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
